[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spikestack-lite"
version = "1.0.0"
description = "3-in-1 spiking transformer: Spire repetition encoder + AstroHebbian spiking attention + SpikeSkip sparse CUDA engine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["spikestack_lite*"]

[tool.setuptools.package-data]
"spikestack_lite.sparse" = ["src/*.cu"]